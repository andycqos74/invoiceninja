name: Build Invoice Ninja images

# Builds both images on GitHub and pushes them to GHCR:
#   ghcr.io/<owner>/invoiceninja-app    <- official invoiceninja/dockerfiles (debian) build
#   ghcr.io/<owner>/invoiceninja-nginx  <- nginx:alpine + config from ./nginx
#
# - push to main / manual run: always builds
# - nightly schedule: builds only when a new Invoice Ninja release is out

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Invoice Ninja version to build, e.g. 5.12.30 (blank = latest release)"
        required: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Resolve version and image names
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="$(gh release view --repo invoiceninja/invoiceninja --json tagName -q .tagName)"
          fi
          version="${version#v}"
          echo "Invoice Ninja version: $version"
          {
            echo "version=$version"
            echo "app=ghcr.io/$owner/invoiceninja-app"
            echo "nginx=ghcr.io/$owner/invoiceninja-nginx"
            echo "url=https://github.com/invoiceninja/invoiceninja/releases/download/v${version}/invoiceninja.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip scheduled run if this version is already built
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             docker manifest inspect "${{ steps.v.outputs.app }}:${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "Already built ${{ steps.v.outputs.version }} - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout official Invoice Ninja Dockerfile (debian)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: invoiceninja/dockerfiles
          ref: debian
          path: upstream

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream/debian
          build-args: URL=${{ steps.v.outputs.url }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.v.outputs.app }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.app }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push nginx image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: nginx
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.v.outputs.nginx }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.nginx }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Trigger Portainer redeploy (optional)
        if: steps.check.outputs.skip != 'true' && env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"
